version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-daily_discovery}
      POSTGRES_USER: ${POSTGRES_USER:-daily_discovery}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-daily_discovery}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
